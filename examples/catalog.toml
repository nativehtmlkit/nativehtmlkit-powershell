# Machine-readable catalogue of the PowerShell SDK examples (NativeHTMLKit 0.1.2).
# `id` is the parity key shared with the Python SDK; `file` is relative to examples/.
# tests/Examples.Tests.ps1 runs every entry with -SelfTest against the real host and fails when an
# entry has no file or an example file has no entry.

[[example]]
id = "hello"
title = "Hello"
summary = "The smallest complete app: a greeting form that writes untrusted text safely."
teaches = ["application lifecycle", "Get-NativeHTMLKitValue", "Set-NativeHTMLKitDocumentText"]
file = "01-hello.ps1"
run = "pwsh -File 01-hello.ps1"
guide = "lifecycle"
language_specific = false

